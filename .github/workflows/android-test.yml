name: Build NieR USA test APK

on:
  workflow_dispatch:
  push:
    branches: [test-nier-usa]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh cmake ninja-build
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build native packer
        run: zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/nxpack"

      - name: Build APK
        working-directory: android/app
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PnxGames=010056B015FE8000 \
            -PnxApp=peanuts \
            -PnxAppId=peanutstest \
            -PnxPackStage="$RUNNER_TEMP/nxpack/stage" \
            -PnxLsfg=false

      - uses: actions/upload-artifact@v4
        with:
          name: Peanuts-NieR-USA-test
          path: android/app/build/outputs/apk/debug/*.apk
